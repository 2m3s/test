name: Build Automative

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Automative
        run: gradle build testmodJar --no-daemon

      - name: Upload Automative JARs
        uses: actions/upload-artifact@v4
        with:
          name: automative-jars
          path: |
            build/libs/*.jar
            build/testmod/*.jar
