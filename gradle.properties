org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric — check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.2+26.1.2

mod_version=1.0.0
maven_group=dev.testkit

# GrimAC, used as a test fixture. Pinned to an exact Modrinth build so a run is reproducible.
# Its fabric.mod.json declares minecraft ">=26.1.2 <26.3".
grim_version=2.3.74-8eb5f28
grim_url=https://cdn.modrinth.com/data/LJNGWSvH/versions/enIsH6sX/grimac-fabric-2.3.74-8eb5f28.jar

# GrimAC does not bundle these and will not start without them.
# cloud-fabric 2.0.0-beta.17 declares minecraft >=26.2 and will NOT load on 26.1.x — beta.16 declares >=26.1.
cloud_version=2.0.0-beta.16
sqlite_version=3.50.3.0
